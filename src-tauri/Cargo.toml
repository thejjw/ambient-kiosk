[package]
name = "ambient-kiosk"
version = "0.1.0"
description = "Ambient full-bleed scroll-free dynamic multi-feed kiosk with alternating tour"
authors = ["thejjw"]
edition = "2021"

[lib]
name = "ambient_kiosk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-proxy", "tray-icon", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"

[[bin]]
name = "ambient-kiosk"
path = "src/main.rs"

[[bin]]
name = "spike"
path = "src/bin/spike.rs"
